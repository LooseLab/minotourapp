<div class="reads-tab-content">
    <div class="row reads-tab-row">
        <div class="col-md-12">
            <div class="reads-tab-hint" role="status">
                <span class="reads-tab-hint__text">To populate the table, click a column header. Sorting can take a moment — a lot of data is processed in the background.</span>
            </div>

            <div class="card obsidian-card rt-panel-card">
                <div class="card-header rt-card-header">
                    <h3 class="card-title rt-card-title">
                        <i class="far fa-comment-alt" aria-hidden="true"></i>
                        Reads
                    </h3>
                </div>
                <div class="card-body rt-card-body">
                    <div class="obsidian-table-wrap rt-table-wrap">
                        <table id="example" class="display rt-reads-table" style="width:100%">
                            <thead>
                            <tr>
                                <th scope="col">Read ID</th>
                                <th scope="col">Read</th>
                                <th scope="col">Channel</th>
                                <th scope="col">Sequence length</th>
                                <th scope="col">RunID</th>
                                <th scope="col">Barcode</th>
                                <th scope="col">Command</th>
                            </tr>
                            </thead>
                            <tfoot>
                            <tr>
                                <th scope="col">Read ID</th>
                                <th scope="col">Read</th>
                                <th scope="col">Channel</th>
                                <th scope="col">Sequence length</th>
                                <th scope="col">RunID</th>
                                <th scope="col">Barcode</th>
                                <th scope="col">Command</th>
                            </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>

    function format(rowData) {
        // function to add the sequence on drop down
        var div = $('<div/>')
            .addClass('loading')
            .text('Loading...');
        $.ajax({
            url: '/api/v1/reads/reads-extra/?search_criteria=read_id&search_value=' + rowData.read_id,
            //dataType: 'json',
            success: function (json) {
                var textarea = $('<textarea rows=10 cols=100/>');
                div
                    .html('')
                    .removeClass('loading');
                textarea.text(json.sequence);
                div.append(textarea);
            }
        });

        return div;
    }
</script>
